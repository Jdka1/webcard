<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Places visited by Aryan Mehra." />
    <title>Travel · Aryan Mehra</title>
    <link rel="icon" href="/public/favicon.jpeg" type="image/jpeg" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="collection-page travel-page">
    <nav class="collection-nav" aria-label="Site navigation"><a href="/">← Aryan Mehra</a></nav>
    <main class="travel-shell">
      <header class="travel-header">
        <div>
          <p class="eyebrow">places i've been</p>
          <h1>field notes<span class="cursor" aria-hidden="true">_</span></h1>
        </div>
        <div class="map-switch" role="group" aria-label="Map view"><button type="button" data-view="globe">globe</button><button type="button" data-view="map">flat map</button></div>
      </header>
      <p id="map-help" class="map-help">drag to turn · scroll to zoom · select a point</p>
      <section class="map-frame" aria-label="Interactive map of visited destinations"><svg id="travel-map" viewBox="0 0 960 580" role="img" aria-label="World map with visited destinations"></svg></section>
      <section class="travel-list-wrap" aria-labelledby="visited-title"><h2 id="visited-title">visited</h2><ol id="travel-list" class="travel-list"></ol></section>
    </main>
    <script type="module" src="/src/travel.js"></script>
  </body>
</html>
