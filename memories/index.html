<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Memories</title>
    <link rel="icon" href="/public/favicon.jpeg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/memories.css" />
  </head>
  <body class="memories-page">

    <header class="memories-head">
      <h1>memories_</h1>
      <p class="memories-sub">a private board. if you can see this, you were let in.</p>
    </header>

    <main class="board" aria-label="Memory board">
      <!-- Placeholder tiles below use already-public photography shots so the
           layout can be previewed. Replace with real memory photos dropped in
           /public/memories/ before this goes live. -->
      <figure class="tile">
        <img src="/public/photography/4V7A0770.jpg" alt="Yosemite Valley panorama with waterfall" loading="lazy" />
        <figcaption><em>Ode to Ansel Adams</em><span class="tile-loc">Yosemite · placeholder</span></figcaption>
      </figure>
      <figure class="tile">
        <img src="/public/photography/4V7A6203.jpg" alt="Moraine Lake with mountain reflections" loading="lazy" />
        <figcaption><em>Jewels</em><span class="tile-loc">Banff · placeholder</span></figcaption>
      </figure>
      <figure class="tile">
        <img src="/public/photography/4V7A5823-Edit-Edit.jpg" alt="Chillon Castle on Lake Geneva under storm clouds" loading="lazy" />
        <figcaption><em>The Rock</em><span class="tile-loc">Montreux · placeholder</span></figcaption>
      </figure>
      <figure class="tile">
        <img src="/public/photography/4V7A3683.jpg" alt="Eagle in flight over a glacial snowfield" loading="lazy" />
        <figcaption><em>700 Miles</em><span class="tile-loc">Harding Icefield · placeholder</span></figcaption>
      </figure>
      <figure class="tile">
        <img src="/public/photography/4V7A1319.jpg" alt="Moose wading through a forest pond" loading="lazy" />
        <figcaption><em>Quiet Intruder</em><span class="tile-loc">Denali · placeholder</span></figcaption>
      </figure>
      <figure class="tile">
        <img src="/public/photography/4V7A6479-Edit.jpg" alt="Frog beside a water lily in a dark pond" loading="lazy" />
        <figcaption><em>Mating Season</em><span class="tile-loc">'Ewa Forest Reserve · placeholder</span></figcaption>
      </figure>
    </main>

    <script src="/src/memories.js"></script>
  </body>
</html>
